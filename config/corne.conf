CONFIG_ZMK_KEYBOARD_NAME="Blasphemy Slate"
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

### Improves compatibility with iPad
# ref: https://zmk.dev/docs/config/system#hid
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# Mouse
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y

# Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# Widgets
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# CONFIG_ZMK_WIDGET_LAYER_STATUS=y
# CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# nice-view-gem
# 60 fps = 960, 30 fps = 1920, 25 fps = 2304, 15 fps = 3840,
# CONFIG_NICE_VIEW_GEM_ANIMATION_MS=3840

# epaper
CONFIG_NICE_EPAPER_ON=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_DPI_DEF=161
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_NICE_OLED_WIDGET_OUTPUT_BACKGROUND=y
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=68
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=160

CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_WINDOWS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_MACOS=n

CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_BONGO_CAT=y

